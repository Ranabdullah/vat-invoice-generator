<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VAT Invoice Generator</title><link rel="stylesheet" href="style.css"><script defer src="invoice.js"></script>
<body><header class="toolbar"><strong>VAT Invoice Generator</strong><div><button id="example">Load example</button> <button id="new">New invoice</button> <button id="print" class="primary">Print / Save PDF</button></div></header>
<main><form id="editor"><h1>Edit invoice</h1>
<fieldset><legend>Business &amp; header</legend>
<label>Invoice heading<input name="heading" required maxlength="80"></label>
<label>Business name<input name="seller" required maxlength="120"></label>
<label>Business address<textarea name="sellerAddress" required></textarea></label>
<div class="fields"><label>VAT registration number<input name="sellerTax" required></label><label>Contact email<input name="email" type="email"></label></div>
<label>Upload logo<input id="logo" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="removeLogo">Remove logo</button>
</fieldset>
<fieldset><legend>Customer &amp; dates</legend>
<label>Customer name<input name="buyer" required></label><label>Customer address<textarea name="buyerAddress" required></textarea></label><label>Customer VAT number<input name="buyerTax"></label>
<div class="fields"><label>Invoice number<input name="number" required></label><label>Issue date<input name="issued" type="date" required></label><label>Supply date<input name="supply" type="date"></label><label>Payment due<input name="due" type="date"></label></div></fieldset>
<fieldset><legend>Items and VAT</legend><label>Default VAT %<input name="vat" type="number" min="0" max="100" step="0.01" required></label><div id="items"></div><button type="button" id="add">Add item</button></fieldset>
<fieldset><legend>Payment details</legend><label>Terms and notes<textarea name="notes"></textarea></label></fieldset>
<p id="status" role="status">Draft saved in this browser. Amounts in EUR.</p>
</form><section id="preview" aria-label="Invoice preview"></section></main></body></html>
